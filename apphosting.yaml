# Firebase App Hosting: confirmed QuoteForge project and backend.
# Configure the web-app values and server secrets in Firebase before enabling services.
runConfig:
  minInstances: 0
  maxInstances: 3
  cpu: 1
  memoryMiB: 1024
  concurrency: 4
env:
  - variable: QUOTEFORGE_DEMO_MODE
    value: "false"
    availability: [RUNTIME]
  - variable: QUOTEFORGE_FIREBASE_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: QUOTEFORGE_USE_EMULATORS
    value: "false"
    availability: [RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: "quote-forge-54595"
    availability: [RUNTIME]
  - variable: FIREBASE_STORAGE_BUCKET
    value: "quote-forge-54595.firebasestorage.app"
    availability: [RUNTIME]
  - variable: EMAIL_DELIVERY_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: QUOTEFORGE_AI_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: OPENAI_API_KEY
    secret: "QUOTEFORGE_OPENAI_API_KEY@1"
    availability: [RUNTIME]
  - variable: OPENAI_MODEL
    value: "gpt-5.4-mini-2026-03-17"
    availability: [RUNTIME]

  - variable: QUOTEFORGE_OWNER_EMAIL
    value: "austenconor02@gmail.com"
    availability: [RUNTIME]
  - variable: QUOTEFORGE_OWNER_BOOTSTRAP_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: STRIPE_ENABLED
    value: "false"
    availability: [RUNTIME]
  # Sandbox price only. Checkout remains disabled until server credentials and webhooks are configured.
  - variable: STRIPE_PRICE_ID
    value: "price_1UZzgz2cpYmPAH1oPaO3jFk8"
    availability: [RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_ENABLED
    value: "true"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: APP_ORIGIN
    value: "https://quoteforge--quote-forge-54595.us-central1.hosted.app"
    availability: [RUNTIME]
  - variable: QUOTEFORGE_OWNER_UID
    value: "EqMe59PieKTkAL2ZVlFvDYUvDp13"
    availability: [RUNTIME]
